 margin:20px;

.card{

/*＝＝＝＝＝フィルターちゃん＝＝＝＝＝*/

}

/*＝＝＝＝＝絞込みの色分け＝＝＝＝＝*/
.filter-mode-btn{

  font-weight:bold;

  color:white;
}

.mode-and{
  background:#4a90e2;
}

.mode-or{
  background:#53b36b;
}

.mode-not{
  background:#d9534f;
}

.mode-off{
  background:#999;
}




#page-home{
  grid-template-columns:1fr 1fr;
  gap:10px;
}

/*#book-list{
  display:grid;

}*/

#search{
flex:1 1 160px;
min-width:120px;
border:1px solid #f4a57a;
border-radius:10px;
font-size:13px;
background:#fffffc;
color:#333;
margin-left:10px;
}

#sort-mode, #view-mode{
display:flex;
flex-wrap:nowrap;
gap:4px;
}

#sort-mode button,
#view-mode button{
white-space:nowrap;
flex:0 0 auto;
}

#sort-mode::after,
#view-mode::after,
#color-mode::after{
content:" / ";
margin:0 4px;
color: #999;
}


#type-filter button{
  padding: 4px 10px;
  border-radius: 999px;
  border: 1px solid #ccc;
  background: #fffffc;
  cursor: pointer;
  color:#ccc
  font-size:13px;
}

#type-filter button.active{
  background: #333;
  color: #fffffc;
  font-size:13px;
}


/* 設定用オンオフトグル？ */
.switch{
  width:40px;
  height:22px;
  background:#ccc;
  border-radius:10px;
  position:relative;
  transition:0.2s;
}

.switch::after{
  content:"";
  width:18px;
  height:18px;
  background:#fffffc;
  border-radius:50%;
  position:absolute;
  top:2px;
  left:2px;
  transition:0.2s;
}

.switch.on{
  background:#f4a57a;
}

.switch.on::after{
  left:20px;
}


/* 本追加モーダルデザイン */

.add-btn{
  width:100px;
  padding:8px;
  margin:10px;
  border:1px solid #f4a57a;

#book-title{

 border:1px dashed #f4a57a;

<script>
window.saveData = async function(){
  const data = {
    books,
    seriesMaster,
    characters,
    tagMaster
  };

  localStorage.setItem("bookAppData", JSON.stringify(data));

  try {
    await window.setDoc(
      window.doc(window.db, "app", "data"),
      data
    );
    console.log("🔥 保存成功");
  } catch (e) {
    console.error("❌ 保存失敗", e);
  }
};
</script>
